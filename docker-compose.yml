services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nexusgraph-falkordb
    ports:
      - "6379:6379"   # Bolt / Redis Protocol for Cypher
      - "3000:3000"   # FalkorDB Browser Web UI
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusgraph-backend
    ports:
      - "8000:8000"   # FastAPI + SSE + MCP endpoints
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=
      - BACKEND_PORT=8000
      - LOG_LEVEL=info
      - SEED_ON_STARTUP=true
    depends_on:
      falkordb:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusgraph-frontend
    ports:
      - "3001:3000"   # Next.js Split-Screen Graph Dashboard
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_FALKORDB_BROWSER_URL=http://localhost:3000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  falkordb_data:
