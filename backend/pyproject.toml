[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusgraph-backend"
version = "0.1.0"
description = "NexusGraph: Autonomous Engineering Brain & Incident Remediation Swarm on FalkorDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "falkordb>=1.0.10",
    "redis>=5.0.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "mcp>=1.0.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
